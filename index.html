<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" type="image/png" href="imagenes/perfil.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script defer src="https://use.fontawesome.com/releases/v6.4.0/js/all.js"></script>
  <link rel="stylesheet" href="style.css">
  <title> ADA-Comi25 - Trabajo final Módulo III </title>

  <style>
    body {
      font-family:Verdana, sans-serif;
    }
  </style>
</head>

<body class="has-background-light"></body>

 <!-- NAV -->
  <nav class="navbar is-primary" style="min-height: 100px;">
    <div class="container">
      <div class="navbar-brand">
        <a class="navbar-item has-text-white is-size-3 has-text-weight-semibold">
          <span class="icon mr-5">
           <i class="fa-solid fa-laptop-code fa-xl"></i>
          </span>
          ADAComi25 Trabajo final Módulo III
        </a>
      </div>
      <div class="navbar-menu">
        <div class="navbar-end">
          <a href="https://github.com/AndreAmutio" target="_blank" class="navbar-item has-text-white has-text-weight-semibold">
            <span class="icon mr-2"><i class="fab fa-github fa-2xl"></i></span>
            <span> GitHub </span>
          </a>
          <div class="navbar-item">
            <button id="btnToggleTheme" class="button is-light">
              <span class="icon "><i id="themeIcon" class="fa-solid fa-moon fa-xl"></i></span>
              <span id="themeLabel"> Oscuro </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

 <!-- BODY -->
  <section class="section">
    <div class="container">

      <!-- Botón Agregar destacado -->
      <div class="has-text-right mb-4">
        <button id="btnOpenAdd" class="button is-info is-medium">
          <span class="icon"><i class="fa-solid fa-plus"></i></span>
          <span>Agregar Estudiante</span>
        </button>
      </div>
   <!-- Barra de filtros -->
      <div id="filterBox" class="box">
        <h2 class="title is-5 mb-3"> Filtros </h2>
        <div class="columns is-multiline is-vcentered">
          <div class="column is-4">
            <div class="field">
              <label class="label is-small"> Buscar por nombre </label>
              <div class="control has-icons-left">
                <input id="searchInput" class="input" type="text" placeholder="Ej: Juan">
                <span class="icon is-left"><i class="fa-solid fa-magnifying-glass"></i></span>
              </div>
            </div>
          </div>
          <div class="column is-3">
            <label class="label is-small"> Carrera </label>
            <div class="select is-fullwidth">
              <select id="filterCareer"><option value=""> Todas </option>
              <option> Frontend </option>
              <option> Backend </option>
              <option> UX-UI </option>
              <option> QA Tester </option>
              </select>
              
            </div>
          </div>
          <div class="column is-3">
            <label class="label is-small"> Seniority </label>
            <div class="select is-fullwidth">
              <select id="filterSeniority">
                <option value=""> Todas </option>
                <option> Junior </option>
                <option> Semi-Senior </option>
                <option> Senior </option>
              </select>
            </div>
          </div>
          <div class="column is-2">
            <label class="label is-small">&nbsp;</label>
            <div class="buttons">
              <button id="btnClearFilters" class="button is-light"> Limpiar </button>
              <button id="btnSearch" class="button is-primary"> Buscar </button>
            </div>
          </div>
        </div>
      </div> 
       <!-- Loader -->
      <div id="globalLoaderContainer" class="has-text-centered mb-4">
        <button id="globalLoader" class="button is-primary is-loading is-hidden"> Cargando </button>
      </div>
      <!-- Resultados -->
      <div id="resultsContainer" class="columns is-multiline"></div>
      <div id="noResults" class="notification is-warning is-hidden">
        No se encontraron resultados con los filtros actuales.
      </div>
    </div>
  </section>





</body>
</html>
